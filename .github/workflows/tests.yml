name: Qualidade

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      atualizar_snapshots:
        description: 'Gerar/atualizar as imagens de referência da regressão visual'
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * *' # todo dia às 06h (horário de Brasília)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE: https://tsvini.github.io/qa-automation-portfolio

jobs:
  qualidade:
    name: Qualidade de código
    if: ${{ !inputs.atualizar_snapshots }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx bddgen
      - name: Lint
        run: npm run lint
      - name: Checagem de tipos
        run: npm run typecheck

  testes:
    name: Testes (PixBank + referência, 3 navegadores)
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Rodar testes
        run: npm test
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: |
            allure-results
            resultados/testes.json
          retention-days: 14
      - name: Guardar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  caca-aos-bugs:
    name: 'Caça aos bugs: ${{ matrix.bug }}'
    needs: qualidade
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bug: [arredondamento, limite_diario, saldo_exato, idempotencia, corrida, bola, noturno, autopix, ui_saldo, a11y_rotulo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Ligar o bug e rodar a suíte (precisa falhar)
        run: node scripts/cacar-bugs.mjs ${{ matrix.bug }}
        env:
          PROJETOS: pixbank-api,pixbank-chromium
      - if: always()
        run: mv resultados/caca-aos-bugs.json resultados/bug-${{ matrix.bug }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-${{ matrix.bug }}
          path: resultados/bug-${{ matrix.bug }}.json
          retention-days: 14

  performance:
    name: Performance (k6)
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - name: Subir o PixBank
        run: |
          TZ=America/Sao_Paulo nohup npm run pixbank > pixbank.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/api/saude
      - name: Teste de carga
        run: mkdir -p resultados && k6 run perf/pix.k6.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-perf
          path: resultados/perf.json
          retention-days: 14

  painel:
    name: Painel de Qualidade + Allure
    needs: [testes, caca-aos-bugs, performance]
    if: always() && needs.testes.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { path: artefatos }
      - name: Juntar resultados
        run: |
          mkdir -p resultados allure-results
          cp -r artefatos/resultados-testes/allure-results/. allure-results/ 2>/dev/null || true
          cp artefatos/resultados-testes/resultados/testes.json resultados/ 2>/dev/null || true
          cp artefatos/resultados-perf/perf.json resultados/ 2>/dev/null || true
          node -e "
            const fs=require('fs');const p='artefatos';
            const bugs=fs.readdirSync(p).filter(d=>d.startsWith('bug-')).flatMap(d=>fs.readdirSync(p+'/'+d).map(f=>JSON.parse(fs.readFileSync(p+'/'+d+'/'+f))).flatMap(j=>j.bugs));
            fs.writeFileSync('resultados/caca-aos-bugs.json',JSON.stringify({detectados:bugs.filter(b=>b.detectado).length,total:bugs.length,bugs},null,2));"
          curl -sf "$SITE/historico.json" -o resultados/historico.json || echo '[]' > resultados/historico.json
      - name: Histórico e metadados do Allure
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sf "$SITE/allure/history/$f" -o "allure-results/history/$f" || rm -f "allure-results/history/$f"
          done
          cp categories.json allure-results/categories.json
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions", "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}",
            "buildOrder": ${{ github.run_number }}, "buildName": "Execução #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "${{ env.SITE }}/allure/"
          }
          EOF
      - run: npx playwright install --with-deps chromium
      - name: Gerar Allure e Painel
        run: |
          npx allure-commandline generate allure-results --clean -o painel-dist/allure
          node scripts/painel.mjs
          node scripts/og-image.mjs
      - if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with: { path: painel-dist }

  publicar:
    name: Publicar no GitHub Pages
    needs: painel
    if: always() && needs.painel.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  atualizar-snapshots:
    name: Atualizar imagens de referência
    if: ${{ inputs.atualizar_snapshots }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Gerar imagens de referência
        run: npx bddgen && npx playwright test --grep @visual --grep-invert @deteccao --update-snapshots=all
      - name: Commitar imagens de referência
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git commit -m "chore: atualiza imagens de referência da regressão visual" || echo "Nenhuma imagem mudou"
          git push
