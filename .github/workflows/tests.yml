name: Testes E2E e API

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # todo dia às 06h (horário de Brasília)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Rodar testes
        run: npm test

      - name: Preparar histórico e metadados do Allure
        if: always()
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sf "https://tsvini.github.io/qa-automation-portfolio/history/$f" -o "allure-results/history/$f" || rm -f "allure-results/history/$f"
          done
          cp categories.json allure-results/categories.json
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Execução #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://tsvini.github.io/qa-automation-portfolio/"
          }
          EOF

      - name: Gerar Allure Report
        if: always()
        run: npx allure-commandline generate allure-results --clean -o allure-report

      - name: Guardar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Preparar publicação no Pages
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  publicar:
    needs: testes
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4